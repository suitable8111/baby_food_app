name: baby_food_app
description: "이유식 분석 및 영양소 계산 앱"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 상태 관리
  provider: ^6.1.2

  # 차트 (영양소 시각화)
  fl_chart: ^0.69.0

  # 라우팅
  go_router: ^14.6.2

  # 로컬 저장소
  shared_preferences: ^2.3.3

  # 날짜/숫자 포맷
  intl: ^0.20.1

  # Firebase
  firebase_core: ^3.9.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.1

  # 로컬 DB (오프라인 지원)
  sqflite: ^2.4.1
  path: ^1.9.0

  # 캘린더
  table_calendar: ^3.1.3

  # 이미지 선택 및 로컬 저장
  image_picker: ^1.0.7
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/recipes/
